include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'

unit_tests julia 1.12:
  extends: .baremetal-runner-beverin-mi300
  variables:
    JULIA: /users/lraess/julia_amd/julia_amd-1.12
    UENV: 56ebb909a6164680
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS_PER_NODE: 4
    SLURM_GPUS_PER_TASK: 1
    SLURM_TIMELIMIT: "00:30:00"
    JULIA_DEPOT_PATH: "${CI_PROJECT_DIR}/.julia" # overrides default ~/.julia
  script:
    - echo "Preparing the AMDGPU test environment"
    - export JULIA_JUSTRELAX_BACKEND=AMDGPU
    - export JULIA_CSCS_CI=true
    - srun -n 1 --uenv $UENV --view=default $JULIA --project -e '
      println("Instantiating project");
      using Pkg;
      Pkg.instantiate();
      Pkg.test("JustRelax"; test_args=["--backend=AMDGPU"])'

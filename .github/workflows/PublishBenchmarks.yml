# Downloads the public benchmark artifacts of Buildkite builds of `main` and stores them on the
# `benchmark-data` branch, from which the documentation's Performance page reads
# `benchmark_history.json`. A build's final status triggers this workflow; the schedule also
# collects results from builds that never finish (e.g. a GPU queue without agents), because each
# benchmark job's results are published as soon as that job has passed.
name: Publish benchmarks
on:
  status:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: publish-benchmarks
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'status' || (
        github.event.context == 'buildkite/justrelax-dot-jl' &&
        github.event.state != 'pending' &&
        contains(github.event.branches.*.name, 'main'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.sha }}
      - uses: actions/checkout@v7
        with:
          ref: benchmark-data
          path: history

      - name: Download benchmark artifacts
        id: download
        shell: python3 {0}
        env:
          BUILD_URL: ${{ github.event.target_url }}
          COMMIT: ${{ github.event.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          import json, os, urllib.request

          def get(url, headers={}):
              request = urllib.request.Request(url, headers={"Accept": "application/json", **headers})
              with urllib.request.urlopen(request) as response:
                  return response.read()

          def github(path):
              auth = {"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"]}
              return json.loads(get(f"https://api.github.com/repos/{os.environ['REPO']}/{path}", auth))

          # (commit, Buildkite build URL) pairs to collect results from.
          if os.environ["COMMIT"]:
              builds = [(os.environ["COMMIT"], os.environ["BUILD_URL"])]
          else:
              builds = []
              for commit in github("commits?sha=main&per_page=10"):
                  sha = commit["sha"]
                  # A merged commit also carries the statuses of its pull-request branch builds.
                  urls = {s["target_url"].split("#")[0] for s in github(f"commits/{sha}/statuses?per_page=100")
                          if s["context"] == "buildkite/justrelax-dot-jl"}
                  if not urls:
                      print(f"skipping {sha}: no Buildkite build")
                  builds.extend((sha, url) for url in sorted(urls))

          found = False
          for commit, build_url in builds:
              build_url = build_url.split("#")[0]
              build = json.loads(get(build_url + ".json"))
              if build["commit_id"] != commit:
                  raise SystemExit(f"{build_url} built {build['commit_id']}, not {commit}")
              # Tag and pull-request builds of a main commit report to the same status context.
              if build["branch_name"] != "main" or build["pull_request"]:
                  print(f"skipping {build_url}: branch {build['branch_name']!r}")
                  continue
              jobs = json.loads(get(build_url + "/data/jobs.json"))
              if jobs["has_next_page"]:
                  raise SystemExit("Buildkite paginated the job list; fetch every page before publishing")
              benchmark_jobs = [
                  j for j in jobs["records"]
                  if (j.get("name") or "").startswith(":stopwatch: Benchmarks")
                  and j["state"] == "finished" and j["passed"] and not j["retried_in_job_uuid"]
              ]
              for job in benchmark_jobs:
                  artifacts = json.loads(get("https://buildkite.com" + job["base_path"] + "/artifacts"))
                  names = [a["file_name"] for a in artifacts]
                  results = [a for a in artifacts
                             if a["file_name"].startswith("benchmark_results_") and a["file_name"].endswith(".json")]
                  if not results:
                      raise SystemExit(f"{job['name']} in {build_url} passed but uploaded no benchmark_results_*.json: {names}")
                  for artifact in results:
                      name = artifact["file_name"]
                      if os.path.exists(os.path.join("history", "results", commit, name.removeprefix("benchmark_results_"))):
                          continue
                      data = get("https://buildkite.com" + artifact["url"])
                      # A dirty result already failed the run triggered by its own build.
                      if not os.environ["COMMIT"] and b'"dirty": true' in data:
                          print(f"skipping {name} from {build_url}: measured on a dirty worktree")
                          continue
                      os.makedirs(os.path.join("incoming", commit), exist_ok=True)
                      with open(os.path.join("incoming", commit, name), "wb") as io:
                          io.write(data)
                      print("downloaded", name, "from", job["name"], "in", build_url)
                      found = True

          with open(os.environ["GITHUB_OUTPUT"], "a") as io:
              io.write(f"found={str(found).lower()}\n")

      - uses: julia-actions/setup-julia@v3
        if: steps.download.outputs.found == 'true'
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        if: steps.download.outputs.found == 'true'

      - name: Store results and rebuild the history
        if: steps.download.outputs.found == 'true'
        env:
          JULIA_PKG_PRECOMPILE_AUTO: 0
        run: |
          if grep -l '"dirty": true' incoming/*/*.json; then
              echo "refusing to publish results measured on a dirty worktree" >&2
              exit 1
          fi
          for result in incoming/*/*.json; do
              commit=$(basename "$(dirname "$result")")
              name=$(basename "$result")
              mkdir -p "history/results/$commit"
              cp "$result" "history/results/$commit/${name#benchmark_results_}"
          done
          julia --project=benchmarking benchmarking/setup.jl
          inputs=()
          for result in history/results/*/*.json; do inputs+=("--input=$result"); done
          julia --project=benchmarking benchmarking/build_dashboard.jl "${inputs[@]}" \
              --output=history/benchmark_history.json

      - name: Push history
        if: steps.download.outputs.found == 'true'
        run: |
          git -C history add results benchmark_history.json
          git -C history -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Benchmark results for $(ls incoming | tr '\n' ' ')[skip ci]"
          git -C history push origin benchmark-data
